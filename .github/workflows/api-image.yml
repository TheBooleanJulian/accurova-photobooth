name: API image

# Builds the API container on every change to it, and publishes it to the
# GitHub Container Registry from main. Pull it from any container host:
#   ghcr.io/<owner>/accurova-photobooth-api:latest
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'templates/**', '.github/workflows/api-image.yml']
  pull_request:
    paths: ['services/api/**', 'templates/**', '.github/workflows/api-image.yml']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/accurova-photobooth-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -e PHOTOBOOTH_SEGMENTATION_PROVIDER=mock "$IMAGE:latest"
          for i in $(seq 1 20); do curl -fsS localhost:8000/api/admin/health && break; sleep 1; done
          curl -fsS localhost:8000/api/admin/health | grep -q '"templates":1'
          curl -fsS localhost:8000/api/templates/little-red-dot-tours > /dev/null
          docker logs api | tail -5
      - name: Publish
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
